<!DOCTYPE html>
<html>
<head>
    <title>Network Traffic Classifier</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .input-box {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
        }
        .button {
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            margin-right: 10px;
        }
        .analyze-button {
            background-color: #4CAF50;
            color: white;
        }
        .reset-button {
            background-color: #f44336;
            color: white;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #ddd;
        }
        .normal { color: green; }
        .malicious { color: red; }
        .histogram {
            margin: 20px 0;
            display: flex;
            gap: 10px;
        }
        .bar {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .bar-value {
            width: 40px;
            background-color: #ddd;
            margin-bottom: 5px;
            text-align: center;
        }
        .normal-bar { background-color: #4CAF50; }
        .malicious-bar { background-color: #f44336; }
        
        /* New styles for columns */
        .columns-container {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }
        .column {
            flex: 1;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            min-height: 200px;
            max-height: 400px;
            overflow-y: auto;
        }
        .column h2 {
            margin-top: 0;
            padding-bottom: 10px;
            border-bottom: 1px solid #ddd;
        }
        .pattern-item {
            padding: 8px;
            margin: 5px 0;
            border-radius: 3px;
            background-color: #f5f5f5;
        }
    </style>
</head>
<body>
    <h1>Network Traffic Classifier</h1>
    
    <textarea id="trafficPattern" class="input-box" rows="4" 
              placeholder="Enter network traffic pattern..."></textarea>
    
    <div>
        <button onclick="analyzeTraffic()" class="button analyze-button">Analyze</button>
        <button onclick="resetAll()" class="button reset-button">Reset All</button>
    </div>
    
    <div id="result" class="result-box" style="display: none;">
        Classification: <span id="classification"></span>
    </div>
    
    <div class="histogram">
        <div class="bar">
            <div id="normalBar" class="bar-value normal-bar">0</div>
            <div>Normal</div>
        </div>
        <div class="bar">
            <div id="maliciousBar" class="bar-value malicious-bar">0</div>
            <div>Malicious</div>
        </div>
    </div>

    <div class="columns-container">
        <div class="column">
            <h2 class="normal">Normal Traffic</h2>
            <div id="normalPatterns"></div>
        </div>
        <div class="column">
            <h2 class="malicious">Malicious Traffic</h2>
            <div id="maliciousPatterns"></div>
        </div>
    </div>

    <script>
        function analyzeTraffic() {
            const trafficPattern = document.getElementById('trafficPattern').value;
            
            fetch('/analyze', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({traffic_pattern: trafficPattern})
            })
            .then(response => response.json())
            .then(data => {
                // Update result
                const resultDiv = document.getElementById('result');
                const classificationSpan = document.getElementById('classification');
                resultDiv.style.display = 'block';
                classificationSpan.textContent = data.result;
                classificationSpan.className = data.result.toLowerCase();
                
                // Update histogram
                document.getElementById('normalBar').textContent = data.normal_count;
                document.getElementById('maliciousBar').textContent = data.malicious_count;
                
                // Update pattern lists
                updatePatternList('normalPatterns', data.normal_patterns);
                updatePatternList('maliciousPatterns', data.malicious_patterns);
                
                // Clear input
                document.getElementById('trafficPattern').value = '';
            });
        }

        function updatePatternList(elementId, patterns) {
            const container = document.getElementById(elementId);
            container.innerHTML = '';
            patterns.forEach(pattern => {
                const div = document.createElement('div');
                div.className = 'pattern-item';
                div.textContent = pattern;
                container.appendChild(div);
            });
        }

        function resetAll() {
            fetch('/reset', {
                method: 'POST'
            })
            .then(response => response.json())
            .then(data => {
                // Reset histogram
                document.getElementById('normalBar').textContent = '0';
                document.getElementById('maliciousBar').textContent = '0';
                
                // Reset pattern lists
                document.getElementById('normalPatterns').innerHTML = '';
                document.getElementById('maliciousPatterns').innerHTML = '';
                
                // Hide result box
                document.getElementById('result').style.display = 'none';
            });
        }
    </script>
</body>
</html>
